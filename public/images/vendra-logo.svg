<svg width="220" height="64" viewBox="0 0 220 64" fill="none" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <linearGradient id="vendraGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">

            <stop stop-color="#A13CFF"></stop>
            <stop offset="1" stop-color="#5426DB"></stop>

        </linearGradient>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">

            <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7434F3" flood-opacity="0.25"></feDropShadow>

        </filter>
    </defs>


    <!-- Icon background -->
    <rect x="4" y="6" width="52" height="52" rx="16" fill="url(#vendraGradient)" filter="url(#shadow)"></rect>


