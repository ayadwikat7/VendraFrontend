    <!-- Brand name -->
    <text x="69" y="41" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" fill="#17172D">

        Vendra

    </text>


    <!-- Dot -->
    <circle cx="178" cy="38" r="4.5" fill="#7434F3"></circle>

</svg>